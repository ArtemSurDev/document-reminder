{% extends "base.html" %}

{% block title %}Удалить документ{% endblock %}

{% block content %}
<h1>Удалить документ?</h1>
<p>Вы уверены, что хотите удалить документ «{{ document.title }}»?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Да, удалить</button>
    <a href="{% url 'documents:detail' document.id %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
