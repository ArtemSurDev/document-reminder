{% extends "base.html" %}

{% block title %}Статистика — Сервис напоминаний{% endblock %}

{% block content %}
<h1>Статистика по документам</h1>

<div class="list-group">
    {% for item in stats %}
        <div class="list-group-item d-flex justify-content-between align-items-center">
            <span>{{ item.user_name }}</span>
            <span class="badge bg-primary rounded-pill">{{ item.doc_count }} док.</span>
        </div>
    {% empty %}
        <p>Данных нет.</p>
    {% endfor %}
</div>
{% endblock %}
