{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Сервис напоминаний{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'homepage/css/style.css' %}">
</head>
<body>
    <header class="py-2">
        <div class="container text-center">
            <img src="{% static 'homepage/img/logo.png' %}" alt="Логотип" class="site-logo">
        </div>
    </header>

    {% include "includes/navigation.html" %}

    <main class="container mt-4">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="container mt-5 mb-3">
        <hr>
        <p class="text-muted text-center">
            © <span id="current-year"></span> Сервис напоминаний о сроках документов
        </p>
    </footer>

    <script src="{% static 'homepage/js/main.js' %}"></script>
</body>
</html>
